<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .loader {
            text-align: center;
            color: white;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #334155;
            border-top-color: #22d3ee;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #22d3ee;
            margin-top: 20px;
            display: inline-block;
        }
        /* LiveChat floating */
        .livechat-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #22d3ee;
            z-index: 9999;
        }
        .chat-panel {
            position: fixed;
            bottom: 95px;
            right: 20px;
            width: 350px;
            max-width: calc(100vw - 40px);
            height: 450px;
            background: #111827;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: scale(0.9);
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
            border: 1px solid #334155;
            z-index: 9998;
        }
        .chat-panel.open {
            transform: scale(1);
            opacity: 1;
            visibility: visible;
        }
        .chat-header {
            background: #0f172a;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
        }
        .chat-header span { color: white; }
        .close-chat {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
        }
        .chat-body {
            flex: 1;
            overflow: auto;
            background: #0f172a;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h3>Mengarahkan ke website...</h3>
        <p>Jika tidak otomatis, <a href="https://zerovoxynstore.id/" target="_blank">klik disini</a></p>
    </div>

    <div class="livechat-btn" id="chatBtn">💬</div>
    <div class="chat-panel" id="chatPanel">
        <div class="chat-header">
            <span>💬 LiveChat</span>
            <button class="close-chat" id="closeBtn">✕</button>
        </div>
        <div class="chat-body" id="chatBody">
            https://embed.tawk.to/65de16139131ed19d972525f/1hnlocg82
        </div>
    </div>

    <script>
        // Redirect otomatis ke website
        window.location.href = "https://zerovoxynstore.id/";
    </script>
    <script>
        var btn = document.getElementById("chatBtn");
        var panel = document.getElementById("chatPanel");
        var close = document.getElementById("closeBtn");
        btn.onclick = function() { panel.classList.toggle("open"); };
        close.onclick = function() { panel.classList.remove("open"); };
    </script>
</body>
</html>
