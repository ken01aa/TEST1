<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Dashboard | LiveChat Integration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { height: 100vh; width: 100vw; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
        .livechat-floating { position: fixed; bottom: 24px; right: 24px; z-index: 9999; }
        .chat-toggle { width: 60px; height: 60px; background: linear-gradient(145deg, #1e293b, #0f172a); border-radius: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.4); border: 1px solid rgba(56,189,248,0.5); font-size: 30px; transition: 0.2s; }
        .chat-toggle:hover { transform: scale(1.08); }
        .chat-panel { position: fixed; bottom: 100px; right: 24px; width: 380px; max-width: calc(100vw - 40px); height: 500px; max-height: 65vh; background: #111827; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; transform: scale(0.9); opacity: 0; visibility: hidden; transition: all 0.2s ease; transform-origin: bottom right; border: 1px solid #334155; }
        .chat-panel.open { transform: scale(1); opacity: 1; visibility: visible; }
        .chat-header { background: #0f172a; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .chat-header h4 { color: #e2e8f0; font-size: 15px; }
        .close-chat { background: rgba(255,255,255,0.05); border: none; color: #cbd5e1; width: 28px; height: 28px; border-radius: 20px; cursor: pointer; font-size: 16px; }
        .close-chat:hover { background: #ef4444; }
        .chat-body { flex: 1; background: #0f172a; overflow: auto; }
        .mode-badge { position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 20px; font-size: 10px; color: #94a3b8; z-index: 9999; pointer-events: none; }
        @media (max-width: 640px) { .chat-panel { width: 300px; right: 16px; bottom: 85px; } .chat-toggle { width: 52px; height: 52px; font-size: 26px; } }
    </style>
</head>
<body>
    <iframe src="https://r.jina.ai/https://zerovoxynstore.id/" title="Website Target" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <div class="mode-badge">📡 Proxy Mode (mengatasi blokiran)</div>
    <div class="livechat-floating">
        <div class="chat-toggle" id="chatToggleBtn">💬</div>
        <div class="chat-panel" id="chatPanel">
            <div class="chat-header">
                <h4>💬 LiveChat Support</h4>
                <button class="close-chat" id="closeChatBtn">✕</button>
            </div>
            <div class="chat-body" id="chatBody">
                <div style="background:#1e293b; padding:20px; text-align:center; border-radius:16px; height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column;"><div style="font-size:48px; margin-bottom:10px;">💬</div><div style="font-weight:bold; margin-bottom:5px; color:#e2e8f0;">LiveChat Siap Dipasang</div><div style="font-size:12px; color:#94a3b8;">Masukkan ID/embed code di generator</div></div>
            </div>
        </div>
    </div>
    <script>
        var toggle = document.getElementById("chatToggleBtn");
        var panel = document.getElementById("chatPanel");
        var close = document.getElementById("closeChatBtn");
        function openPanel() { panel.classList.add("open"); }
        function closePanel() { panel.classList.remove("open"); }
        toggle.onclick = function() { if (panel.classList.contains("open")) closePanel(); else openPanel(); };
        close.onclick = closePanel;
        document.addEventListener("click", function(e) { if (!panel.contains(e.target) && !toggle.contains(e.target) && panel.classList.contains("open")) { closePanel(); } });
    </script>
</body>
</html>
